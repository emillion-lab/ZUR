name: Fetch Events
# Събития от Eventfrog Public API v1.
# Изисква repo secret EVENTFROG_KEY (Settings → Secrets and variables →
# Actions → Repository secrets). Внимание: секретите за Dependabot и за
# Environments са отделни списъци и НЕ се виждат тук.
on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.run'
      - 'scripts/fetch_events.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare data dir
        run: mkdir -p data

      # Проверка дали секретът изобщо стига дотук. Стойността не се
      # показва — само дължината, което стига да се разбере дали е
      # зададен и дали не е залепнало нещо празно.
      - name: Check secret
        env:
          EVENTFROG_KEY: ${{ secrets.EVENTFROG_KEY }}
        run: |
          if [ -z "$EVENTFROG_KEY" ]; then
            echo "EVENTFROG_KEY е ПРАЗЕН за този workflow."
            echo "Провери:"
            echo "  1. Името е точно EVENTFROG_KEY (главни букви, долна черта)"
            echo "  2. Сложен е в 'Repository secrets', не в Dependabot и не в Environment"
            echo "  3. Repo-то е emillion-lab/ZUR, а не друго"
          else
            echo "EVENTFROG_KEY е наличен, дължина: ${#EVENTFROG_KEY} знака"
          fi

      - name: Fetch events
        continue-on-error: true
        env:
          EVENTFROG_KEY: ${{ secrets.EVENTFROG_KEY }}
        run: python3 scripts/fetch_events.py 2>&1 | tee data/events-log.txt

      - name: Summary
        if: always()
        run: |
          echo "── лог ──"
          cat data/events-log.txt || echo "няма лог"
          echo ""
          if [ -f data/events.json ]; then
            python3 - <<'EOF'
          import json, collections
          d = json.load(open('data/events.json'))
          ev = d.get('events') or []
          print('събития:', len(ev))
          c = collections.Counter(e['venue'] for e in ev)
          for v, n in c.most_common(10):
              print(f'  {v:26s} {n}')
          EOF
          else
            echo "няма data/events.json"
          fi

      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@zur
          git add -f data/events.json data/events-log.txt 2>/dev/null || true
          git add -A data 2>/dev/null || true
          git commit -m "events refreshed [skip ci]" || echo "без промени"
          git fetch origin main && git rebase origin/main || true
          git push
