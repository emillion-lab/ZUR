name: Fetch Events
# Залите в Цюрих. Всеки източник е отделен — ако един се счупи,
# останалите работят и това личи в лога.
on:
  schedule:
    - cron: '40 4 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.run'
      - 'scripts/fetch_events.py'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare data dir
        run: mkdir -p data

      - name: Scrape venues
        continue-on-error: true
        run: python3 scripts/fetch_events.py 2>&1 | tee data/events-log.txt

      - name: Summary
        if: always()
        run: |
          echo "── лог ──"
          cat data/events-log.txt || echo "няма лог"
          echo ""
          if [ -f data/events.json ]; then
            python3 - <<'EOF'
          import json, collections
          d = json.load(open('data/events.json'))
          ev = d.get('events') or []
          print('събития:', len(ev))
          c = collections.Counter(e['venue'] for e in ev)
          for v, n in c.most_common():
              print(f'  {v:16s} {n}')
          EOF
          else
            echo "няма data/events.json"
          fi

      - name: Commit
        if: always()
        run: |
          git config user.name ci; git config user.email ci@zur
          git add -f data/events.json data/events-log.txt 2>/dev/null || true
          git add -A data 2>/dev/null || true
          git commit -m "events refreshed [skip ci]" || echo "без промени"
          git fetch origin main && git rebase origin/main || true
          git push
